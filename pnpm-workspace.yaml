allowBuilds:
  # Reviewed 2026-09-15. Native binaries needed at build time:
  "@swc/core": true # Next.js compiler
  unrs-resolver: true # eslint-import-resolver-typescript
  "@sentry/cli": true # source-map upload when SENTRY_DSN is set
  # Optional dev-only file watcher; Next.js has its own. No postinstall needed.
  "@parcel/watcher": false
minimumReleaseAgeExclude:
  # Added 2026-10-05 by the V3-01 upgrade (published < 24 h before install).
  - data-urls@8.0.0
  - jsdom@30.1.2
  - lucide-react@1.52.0
  - tr46@7.0.0
  - whatwg-url@17.2.0
overrides:
  # S-02 (2026-10-05): transitive dev-only deps with published fixes (pnpm audit high).
  "brace-expansion@<2": 1.1.21
  "brace-expansion@>=4 <6": 5.0.12
  "fast-uri@>=3 <3.1.8": 3.1.8
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 has no patched release. Only path: eslint-config-next >
    # @next/eslint-plugin-next > fast-glob > micromatch; it expands globs we
    # write, at lint time, never user input. Re-check when a fix ships.
    - GHSA-vfj7-8cjw-p6xm
