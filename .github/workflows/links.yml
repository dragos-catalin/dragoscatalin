name: Links

# S-02: link health of the LIVE site. Paused project sites answer 402/404 and
# a registry link silently rots; this catches it weekly and on demand.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Collect live URLs (sitemap + llms.txt)
        run: |
          curl -fsSL https://dragoscatalin.ro/sitemap.xml -o sitemap.xml
          curl -fsSL https://dragoscatalin.ro/llms.txt -o llms.txt
          grep -oE '<loc>[^<]+' sitemap.xml | sed 's/<loc>//' > urls.txt
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        id: lychee
        with:
          args: --config lychee.toml urls.txt llms.txt
          fail: false
      - name: Open or update an issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --label links --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file lychee/out.md
          else gh issue create --title "Broken links on dragoscatalin.ro" --label links --body-file lychee/out.md; fi
