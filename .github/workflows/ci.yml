name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Default: GitHub-hosted. To use the WSL self-hosted runner on the workstation, set the repo variable
    #   gh variable set CI_RUNNER --body '["self-hosted","linux","dragoscatalin-linux"]'
    # See docs/CI.md for registering the runner. Unset the variable to fall back to ubuntu-latest.
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      CI: 1
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: node scripts/check-messages.mjs
      - run: node scripts/check-tracker.mjs
      - run: pnpm audit --audit-level high
      - run: pnpm test -- --coverage
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm size
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start production server
        run: |
          pnpm start > .next/start.log 2>&1 &
          npx --yes wait-on@8 http://localhost:24789 --timeout 60000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # S-01: the visual gates the repo calls non-negotiable, against `next start`.
      - run: pnpm scan:contrast
      - run: pnpm scan:layout
      # Playwright reuses the running server (reuseExistingServer: true).
      - run: pnpm test:e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            .next/start.log
          retention-days: 7

  secrets:
    # S-02: full-history secret scan on every push/PR.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
