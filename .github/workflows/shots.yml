name: Screenshots

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: Comma-separated project slugs (empty = all)
        required: false
        default: ""
      force:
        description: Re-capture even when fresh
        type: boolean
        required: false
        default: false

concurrency:
  group: shots
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 1
      SHOTS_BASE_URL: https://dragoscatalin.ro
      # GitHub cannot glob secrets: list every internal-page storageState secret
      # referenced from shots.config.json explicitly, one line each.
      # SHOTS_STATE_BRIVIO: ${{ secrets.SHOTS_STATE_BRIVIO }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture screenshots
        run: >
          pnpm shots
          ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
          ${{ inputs.force == true && '--force' || '' }}
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(shots): weekly screenshot refresh"
          title: "chore(shots): weekly screenshot refresh"
          body: |
            Automated Playwright captures of every live project (desktop/tablet/mobile × dark/light + full-page).
            Generated by `.github/workflows/shots.yml` → `scripts/shots.mjs`.
          branch: chore/shots-refresh
          delete-branch: true
          add-paths: |
            public/shots/**
            public/shots/manifest.json
          labels: automated
